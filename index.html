            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How much DAP and Urea should I give in one acre of wheat?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "For 1 acre of wheat, apply 50-55 kg (1 bag) of DAP as a basal dose during sowing. Apply 90-100 kg of Urea in two split doses: 45 kg after the first irrigation (21-25 days, CRI stage) along with 5 kg Zinc Sulphate, and 45 kg at tillering (40-45 days)."
                }
              },
              {
                "@type": "Question",
                "name": "Can we mix DAP and Urea together?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "DAP and Urea should never be pre-mixed and stored together. Urea is hygroscopic (draws moisture) and reacts with DAP, turning it into a wet slurry and causing nitrogen loss as ammonia gas. If broadcasting together, mix only 15-20 minutes before field application."
                }
              },
              {
                "@type": "Question",
                "name": "What should be done when wheat leaves turn yellow?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yellow leaves indicate Yellow Rust fungal infection or nitrogen deficiency. For Yellow Rust, spray Propiconazole 25% EC at 1 ml per liter of water during sunny weather. For nitrogen deficiency, apply foliar spray of 2% Urea solution."
                }
              }
            ]
          }
        ]
      }
